services:
  web:
    build: ./docker/php
    container_name: gudang_web
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    environment:
      DB_HOST: db
      DB_USER: gudang
      DB_PASS: gudang123
      DB_NAME: db_gudang
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:5.7
    container_name: gudang_db
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+07:00
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: db_gudang
      MYSQL_USER: gudang
      MYSQL_PASSWORD: gudang123
      TZ: Asia/Jakarta
    ports:
      - "3309:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      # pakai TCP (127.0.0.1) supaya belum "healthy" selama proses init (server init berjalan tanpa jaringan)
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: gudang_pma
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  db_data:
